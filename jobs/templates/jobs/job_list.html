<!DOCTYPE html>
<html>
<head>
    <title>Job Listings</title>
</head>

<body>

    <h1>Available Jobs</h1>

    {% for job in jobs %}

        <h2>{{ job.title }}</h2>

        <p><strong>Company:</strong> {{ job.company }}</p>
        <p><strong>Location:</strong> {{ job.location }}</p>
        <p><strong>Salary:</strong> {{ job.salary }}</p>
        <p>{{ job.description }}</p>

        <hr>

    {% empty %}

        <p>No jobs have been posted yet.</p>

    {% endfor %}

</body>
</html>
